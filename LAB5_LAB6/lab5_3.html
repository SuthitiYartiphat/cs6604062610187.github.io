<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function changecolor(inputid) {
        var input = document.getElementById(inputid);
        input.style.color = 'green';
    }
</script>
<body>
    Name:<input type="text" id="name" autofocus onblur="changecolor('name')"required><br>
    Age:<input type="text" id="age" onblur="changecolor('age')"required><br>
    Birthdate:<input type="text" id="DOB" onblur="changecolor('DOB')"required>
</body>
</html>
